<!--
  파비콘 — 와인잔.

  이모지·폰트 글리프를 쓰지 않고 벡터로 직접 그린다.
  글리프는 환경에 따라 두부로 깨질 수 있어 이 프로젝트에서는 쓰지 않는다(product.md 의 별 아이콘 결정과 같은 이유).

  색은 앱 테마의 버건디(`app/globals.css` 의 --color-burgundy-700/50)를 그대로 쓴다.
  16x16 로 축소돼도 형태가 남도록 잔의 볼을 크게, 스템·베이스를 굵게 그렸다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#6b1f3a" />
  <!-- 잔의 볼: 위가 넓고 아래로 둥글게 좁아진다 -->
  <path d="M9 6h14l-1.1 7.2a5.9 5.9 0 0 1-11.8 0z" fill="#fbf3f5" />
  <!-- 잔에 담긴 와인(볼 하단) -->
  <path d="M10.35 11h11.3l-0.35 2.2a5.9 5.9 0 0 1-10.6 0z" fill="#c65f7f" />
  <!-- 스템 -->
  <rect x="14.8" y="19" width="2.4" height="6" rx="1.2" fill="#fbf3f5" />
  <!-- 베이스 -->
  <rect x="10.5" y="24.4" width="11" height="2.6" rx="1.3" fill="#fbf3f5" />
</svg>
