# 배포 워크플로: main 브랜치에 머지될 때만 실행한다.
# CI(ci.yml)가 이 워크플로 직전에 재실행되어 전부 통과해야 다음 단계로 진행한다.
# ARM64 컨테이너 3개(web/agent/audio)를 빌드해 ECR 에 푸시하고,
# 에이전트 이미지 크기 검사 → prod 배포 → 스모크 테스트 순으로 진행한다.
# dev 환경은 운영하지 않는다(prod 단독 배포).
# 각 job 은 이전 job 의 성공을 needs 로 강제하므로 한 단계라도 실패하면 이후 단계는 실행되지 않는다.
name: Deploy

on:
  push:
    branches: [main]

# 최소 권한 + OIDC. 장기 액세스 키를 저장소에 두지 않는다.
permissions:
  contents: read
  id-token: write

# 새 커밋이 오면 아직 빌드 중인 낡은 실행은 취소한다.
# (취소하지 않으면 실패가 확정된 실행이 큐를 막아 후속 커밋이 배포되지 못한다.
#  실제 배포 단계는 아래 deploy-prod 잡에서 별도 concurrency 로 보호한다.)
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # 예: <account>.dkr.ecr.<region>.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  # design.md 상한: AgentCore 컨테이너 이미지는 2GB 상한.
  # 1.6GB(경고) / 1.9GB(실패) 임계값은 scripts/check-agent-image-size.sh 에서 사용.
  AGENT_IMAGE_WARN_BYTES: '1717986918'  # 1.6 * 1024^3
  AGENT_IMAGE_FAIL_BYTES: '2040109465'  # 1.9 * 1024^3

jobs:
  # 시크릿·변수 누락을 **가장 먼저** 드러낸다.
  # 이 점검이 없으면 ARM64 이미지 빌드를 수십 분 돌린 뒤 자격증명 단계에서 실패하고,
  # 실패 로그를 볼 권한이 없는 사람은 원인을 알 수 없다.
  preflight:
    name: 배포 설정 점검 (시크릿·변수)
    runs-on: ubuntu-latest
    steps:
      - name: 필수 시크릿·변수 확인
        env:
          # Secrets 탭
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Variables 탭
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          ECR_REGISTRY_VAR: ${{ vars.ECR_REGISTRY }}
          PROD_HOSTED_ZONE_ID: ${{ vars.PROD_HOSTED_ZONE_ID }}
          PROD_CERTIFICATE_ARN: ${{ vars.PROD_CERTIFICATE_ARN }}
          PROD_CF_DISTRIBUTION_ID: ${{ vars.PROD_CF_DISTRIBUTION_ID }}
          PROD_AGENT_RUNTIME_ARN: ${{ vars.PROD_AGENT_RUNTIME_ARN }}
          PROD_BEDROCK_PROFILE_ARN: ${{ vars.PROD_BEDROCK_PROFILE_ARN }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          missing_secrets=""
          missing_vars=""

          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            missing_secrets="AWS_DEPLOY_ROLE_ARN"
          fi

          for name in AWS_REGION_VAR ECR_REGISTRY_VAR PROD_HOSTED_ZONE_ID PROD_CERTIFICATE_ARN \
                      PROD_CF_DISTRIBUTION_ID PROD_AGENT_RUNTIME_ARN PROD_BEDROCK_PROFILE_ARN \
                      PROD_BASE_URL; do
            if [ -z "${!name}" ]; then
              # 환경변수 이름과 GitHub 변수 이름이 다른 두 개는 표시를 맞춘다
              display="${name%_VAR}"
              missing_vars="${missing_vars} ${display}"
            fi
          done

          if [ -n "${missing_secrets}" ] || [ -n "${missing_vars}" ]; then
            [ -n "${missing_secrets}" ] && echo "::error::Secrets 누락: ${missing_secrets}"
            [ -n "${missing_vars}" ] && echo "::error::Variables 누락:${missing_vars}"
            echo "Settings > Secrets and variables > Actions 에서 등록하세요."
            echo "Secrets 와 Variables 는 **다른 탭**이다 — 시크릿을 Variables 에 넣으면 여기서 걸린다."
            exit 1
          fi
          echo "시크릿 1개 + 변수 8개 확인 완료"

  # main 에 이미 반영된 코드라도 배포 직전에 다시 전체 검증을 강제한다.
  # (ci.yml 자체를 재사용 워크플로로 호출해 lint/typecheck/test/build 를 반복 실행)
  ci:
    name: CI 재검증
    uses: ./.github/workflows/ci.yml

  build-web:
    name: Build & Push — web (Next.js, ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [preflight, ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC role assume)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2


      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: web 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          # Lambda·AgentCore 는 OCI manifest/attestation index 를 거부한다
          # (`The image manifest, config or layer media type ... is not supported`).
          # provenance·sbom 을 끄고 Docker manifest v2 로 푸시해야 한다.
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false,push=true
          tags: |
            ${{ env.ECR_REGISTRY }}/waganda-web:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/waganda-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # `/_next/static/*` 는 S3 오리진에서 서빙되므로 배포 잡이 S3 에 올려야 한다.
      # 추출은 **이 잡에서** 한다 — 러너가 arm64 라서 이미지 아키텍처와 일치하고,
      # amd64 배포 잡에서 arm64 이미지를 다룰 때 생기는 플랫폼 문제를 피할 수 있다.
      # 이미지에서 꺼내므로 Lambda 가 서빙하는 것과 정확히 같은 산출물이 보장된다.
      - name: 정적 자산 추출
        run: |
          set -euo pipefail
          IMAGE="${{ env.ECR_REGISTRY }}/waganda-web:${{ env.IMAGE_TAG }}"
          docker pull "$IMAGE"
          CID=$(docker create "$IMAGE")
          rm -rf ./static-out && mkdir -p ./static-out
          docker cp "$CID:/app/.next-prod/static" ./static-out/static
          docker rm "$CID"
          echo "추출: $(find ./static-out/static -type f | wc -l) 개 파일"

      - name: 정적 자산 업로드 (배포 잡으로 전달)
        uses: actions/upload-artifact@v4
        with:
          name: next-static
          path: ./static-out/static
          retention-days: 1
          if-no-files-found: error

  build-agent:
    name: Build & Push — agent (Strands TS, ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [preflight, ci]
    permissions:
      contents: read
      id-token: write
    outputs:
      image-ref: ${{ steps.set-ref.outputs.image_ref }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC role assume)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2


      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # 이미지 크기 검사를 위해 로컬 도커 데몬에도 로드한다 (push=true 만으로는
      # 로컬에 이미지가 남지 않아 `docker image inspect` 대상이 없음).
      # agent/Dockerfile 은 lib/·packages/schemas·package-lock.json 을 복사하므로
      # 빌드 컨텍스트가 저장소 루트여야 한다(./agent 로 두면 COPY 가 실패한다).
      - name: agent 이미지 빌드 (로컬 로드 + 푸시)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/arm64
          # Lambda·AgentCore 는 OCI manifest/attestation index 를 거부한다
          # (`The image manifest, config or layer media type ... is not supported`).
          # provenance·sbom 을 끄고 Docker manifest v2 로 푸시해야 한다.
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false,push=true
          load: false
          tags: |
            ${{ env.ECR_REGISTRY }}/waganda-agent:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/waganda-agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: 이미지 참조 출력
        id: set-ref
        run: echo "image_ref=${{ env.ECR_REGISTRY }}/waganda-agent:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  check-agent-image-size:
    name: 에이전트 이미지 크기 검사 (2GB 상한)
    runs-on: ubuntu-24.04-arm
    needs: [build-agent]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정 (OIDC role assume)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      # push 단계에서 로컬에 이미지를 남기지 않았으므로 검사를 위해 pull 한다.
      # 러너는 amd64 라서 `--platform linux/arm64` 를 명시해야 한다
      # (없으면 `no matching manifest for linux/amd64` 로 실패한다). 실행하지 않고
      # 메타데이터만 보므로 에뮬레이션은 필요하지 않다.
      - name: 에이전트 이미지 pull
        run: docker pull --platform linux/arm64 "${{ needs.build-agent.outputs.image-ref }}"

      - name: 이미지 크기 검사 실행
        run: |
          bash scripts/check-agent-image-size.sh \
            "${{ needs.build-agent.outputs.image-ref }}" \
            "${{ env.AGENT_IMAGE_WARN_BYTES }}" \
            "${{ env.AGENT_IMAGE_FAIL_BYTES }}"

  build-audio:
    name: Build & Push — audio (Python Lambda, ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [preflight, ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: audio/Dockerfile 존재 확인
        id: check
        run: |
          if [ -f "audio/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS 자격증명 설정 (OIDC role assume)
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/amazon-ecr-login@v2


      - name: Docker Buildx 설정
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: audio 이미지 빌드 및 푸시
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./audio
          file: ./audio/Dockerfile
          platforms: linux/arm64
          # Lambda·AgentCore 는 OCI manifest/attestation index 를 거부한다
          # (`The image manifest, config or layer media type ... is not supported`).
          # provenance·sbom 을 끄고 Docker manifest v2 로 푸시해야 한다.
          provenance: false
          sbom: false
          outputs: type=image,oci-mediatypes=false,push=true
          tags: |
            ${{ env.ECR_REGISTRY }}/waganda-audio:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/waganda-audio:latest
          cache-from: type=gha,scope=audio
          cache-to: type=gha,mode=max,scope=audio

      - name: audio/Dockerfile 없음 — 중단
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "audio/Dockerfile 이 아직 없습니다 (작업 8 미착수). audio 이미지 배포를 건너뜁니다."

  deploy-prod:
    name: cdk deploy (prod)
    runs-on: ubuntu-latest
    needs: [build-web, check-agent-image-size, build-audio]
    environment: prod
    # CloudFormation 배포가 중간에 취소되면 스택이 UPDATE_IN_PROGRESS 로 남을 수 있다.
    # 워크플로 수준 취소와 분리해 이 잡은 끝까지 실행한다.
    concurrency:
      group: waganda-prod-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: AWS 자격증명 설정 (OIDC role assume)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 컨텍스트 값이 비면 CDK 가 해당 설정을 **제거한 상태로** 배포한다.
      # 도메인 별칭·Route53 레코드가 사라지고 Lambda·AgentCore 환경변수가 비어
      # 서비스가 조용히 망가지므로, 하나라도 없으면 배포하지 않고 실패시킨다.
      - name: 배포 컨텍스트 변수 확인 (누락 시 중단)
        env:
          PROD_HOSTED_ZONE_ID: ${{ vars.PROD_HOSTED_ZONE_ID }}
          PROD_CERTIFICATE_ARN: ${{ vars.PROD_CERTIFICATE_ARN }}
          PROD_CF_DISTRIBUTION_ID: ${{ vars.PROD_CF_DISTRIBUTION_ID }}
          PROD_AGENT_RUNTIME_ARN: ${{ vars.PROD_AGENT_RUNTIME_ARN }}
          PROD_BEDROCK_PROFILE_ARN: ${{ vars.PROD_BEDROCK_PROFILE_ARN }}
        run: |
          missing=""
          for name in PROD_HOSTED_ZONE_ID PROD_CERTIFICATE_ARN PROD_CF_DISTRIBUTION_ID \
                      PROD_AGENT_RUNTIME_ARN PROD_BEDROCK_PROFILE_ARN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::배포 컨텍스트 변수가 비어 있습니다:$missing"
            echo "Settings > Secrets and variables > Actions > Variables 에 등록하세요."
            exit 1
          fi
          echo "배포 컨텍스트 변수 5개 확인 완료"

      - name: cdk deploy --all (prod)
        working-directory: infrastructure
        run: |
          npx cdk deploy --all --require-approval never \
            --context env=prod \
            --context hostedZoneId="${{ vars.PROD_HOSTED_ZONE_ID }}" \
            --context certificateArn="${{ vars.PROD_CERTIFICATE_ARN }}" \
            --context cloudFrontDistributionId="${{ vars.PROD_CF_DISTRIBUTION_ID }}" \
            --context agentRuntimeArn="${{ vars.PROD_AGENT_RUNTIME_ARN }}" \
            --context bedrockModelProfileArn="${{ vars.PROD_BEDROCK_PROFILE_ARN }}"
        env:
          WAGANDA_IMAGE_TAG: ${{ env.IMAGE_TAG }}

      # 정적 자산은 arm64 빌드 잡이 이미지에서 꺼내 아티팩트로 넘긴다.
      # (amd64 러너에서 arm64 이미지를 pull·create 하면 플랫폼 문제가 생긴다)
      - name: 정적 자산 다운로드
        uses: actions/download-artifact@v4
        with:
          name: next-static
          path: ./static-out/static

      - name: 정적 자산 S3 동기화
        run: |
          set -euo pipefail
          COUNT=$(find ./static-out/static -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::정적 자산이 비어 있습니다. 배포하면 /_next/static/* 가 404 가 됩니다."
            exit 1
          fi
          aws s3 sync ./static-out/static "s3://waganda-static-prod/_next/static/" \
            --cache-control "public,max-age=31536000,immutable" --delete --only-show-errors
          echo "동기화 완료: ${COUNT} 개 파일"

      # 공개 페이지는 기본 7일 캐시라 새 배포 후에도 예전 HTML 이 남는다.
      # 정적 자산은 해시 파일명이라 무효화가 필요 없지만 HTML 은 필요하다.
      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.PROD_CF_DISTRIBUTION_ID }}" \
            --paths "/" "/wines*" "/tastings*" "/discoveries*" "/rankings*" "/timeline*" "/explore*" \
            --query 'Invalidation.[Id,Status]' --output text

  smoke-test:
    name: 스모크 테스트 (prod)
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    environment: prod
    permissions:
      contents: read
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 스모크 테스트 실행
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
          AGENT_PING_URL: ${{ vars.PROD_AGENT_PING_URL }}
        run: bash scripts/smoke-test.sh
